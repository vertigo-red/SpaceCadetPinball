name: Linux binaries

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x86_64
    # Build against glibc 2.35 rather than the newer ubuntu-latest baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libsdl2-dev libsdl2-mixer-dev \
            desktop-file-utils patchelf timgm6mb-soundfont

      - name: Build native executable and archive
        run: bash build-linux.sh

      - name: Test the archived executable
        run: |
          mkdir -p "$RUNNER_TEMP/pinball-native"
          tar -xzf build-linux/dist/*.tar.gz -C "$RUNNER_TEMP/pinball-native"
          bash Platform/Linux/smoke-test.sh "$RUNNER_TEMP"/pinball-native/*/SpaceCadetPinball

      - name: Download verified AppImage packaging tool
        run: |
          mkdir -p build-linux/tools
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output build-linux/tools/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  build-linux/tools/linuxdeploy-x86_64.AppImage' | sha256sum --check
          chmod +x build-linux/tools/linuxdeploy-x86_64.AppImage

      - name: Package AppImage
        env:
          LINUXDEPLOY: build-linux/tools/linuxdeploy-x86_64.AppImage
        run: bash Platform/Linux/package-appimage.sh

      - name: Test the extracted AppImage without FUSE
        run: |
          appimage=$(realpath build-linux/dist/*.AppImage)
          mkdir -p "$RUNNER_TEMP/pinball-appimage"
          cd "$RUNNER_TEMP/pinball-appimage"
          "$appimage" --appimage-extract >/dev/null
          bash "$GITHUB_WORKSPACE/Platform/Linux/smoke-test.sh" "$PWD/squashfs-root/AppRun"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpaceCadetPinball-linux-x86_64
          path: build-linux/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
